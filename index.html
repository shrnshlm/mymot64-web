<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c121b">
<title>לאן? · תחבורה ציבורית בישראל</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root{
    --bg:#0b1017; --surface:#131c28; --surface-2:#0f161f; --ink:#eef3f8; --ink-soft:#9aa7b8;
    --line:#22303e; --accent:#f2a544; --accent-ink:#160f04; --live:#41cf83; --rail:#4d82f3;
    --board:#0a0f16; --board-line:#1c2836; --dim:#7c8697;
    --radius:16px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#eceef2;--surface:#ffffff;--surface-2:#f3f5f8;--ink:#151d29;--ink-soft:#54606f;
      --line:#dde2e8;--accent:#c96a10;--accent-ink:#fff;--live:#0f8a4c;--rail:#2a5fd0;
      --board:#0c121b;--board-line:#1c2836;--dim:#7c8697;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom);
    background-image:radial-gradient(120% 60% at 50% -8%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%);}
  .app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}

  header{padding:20px 18px 8px;display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-size:1.25rem;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
  header h1{font-size:1.32rem;margin:0;letter-spacing:-.02em}
  header p{margin:0;font-size:.8rem;color:var(--ink-soft)}

  /* ---- search card ---- */
  form{margin:14px 14px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 16px 34px -20px rgba(0,0,0,.5)}
  .field{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:12px;padding:2px 10px;margin-bottom:8px}
  .field .pin{width:22px;text-align:center;color:var(--accent);font-size:1.05rem;flex:none}
  .field input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:1.05rem;padding:12px 2px;outline:none}
  .field input::placeholder{color:var(--ink-soft)}
  .loc-btn{flex:none;background:none;border:0;color:var(--ink-soft);font:inherit;font-size:.78rem;cursor:pointer;
    display:flex;align-items:center;gap:4px;padding:6px}
  .loc-btn:active{color:var(--accent)}
  .swap{display:block;margin:-14px auto -2px;position:relative;z-index:2;width:34px;height:34px;border-radius:50%;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);font-size:1rem;cursor:pointer}
  .row2{display:flex;gap:8px;margin-top:2px}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1}
  .seg button{flex:1;background:none;border:0;color:var(--ink-soft);font:inherit;font-size:.9rem;padding:9px;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
  input[type=time]{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;color:var(--ink);
    font:inherit;padding:9px 12px;color-scheme:dark;width:118px}
  @media (prefers-color-scheme:light){input[type=time]{color-scheme:light}}
  .go{width:100%;margin-top:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
    font:inherit;font-size:1.06rem;font-weight:650;padding:15px;cursor:pointer;
    box-shadow:0 10px 24px -10px color-mix(in srgb,var(--accent) 70%,transparent)}
  .go:active{transform:translateY(1px)}
  .go[disabled]{opacity:.6}

  /* ---- results ---- */
  main{flex:1;padding:8px 14px 30px}
  .status{text-align:center;color:var(--ink-soft);padding:34px 20px;font-size:.95rem}
  .status.err{color:#f2a544}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);
    margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .route-head{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:.86rem;margin:14px 4px 8px}
  .route-head b{color:var(--ink);font-weight:600}
  .arw{color:var(--accent)}

  .opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .opt-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .opt-time{font-family:var(--mono);font-size:1.12rem;font-weight:600;font-variant-numeric:tabular-nums}
  .opt-time .arw{margin:0 5px}
  .opt-meta{font-size:.82rem;color:var(--ink-soft);text-align:end}
  .opt-meta .dur{color:var(--ink);font-weight:600}
  .legs{background:var(--board);padding:6px 0}
  .leg{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 15px}
  .bul{min-width:32px;height:25px;padding:0 7px;border-radius:7px;display:grid;place-items:center;
    font-family:var(--mono);font-weight:700;font-size:.86rem;background:var(--accent);color:#160f04;flex:none}
  .bul.walk{background:transparent;border:1px dashed var(--board-line);color:var(--dim)}
  .bul.rail{background:var(--rail);color:#fff}
  .leg .txt{min-width:0;color:#eef3f8}
  .leg .txt .a{font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leg .txt .b{font-size:.74rem;color:var(--dim)}
  .leg .t{font-family:var(--mono);font-size:.82rem;color:#eef3f8;text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
  .scoot{display:flex;flex-wrap:wrap;gap:6px;padding:9px 15px 11px;border-top:1px solid var(--board-line);background:var(--board)}
  .chip{font-family:var(--mono);font-size:.72rem;color:var(--dim);border:1px solid var(--board-line);border-radius:999px;padding:4px 9px}
  .chip b{color:var(--live);font-weight:600}
  .badge{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    display:inline-flex;align-items:center;gap:5px}
  .ldot{width:7px;height:7px;border-radius:50%;background:var(--live)}
  .hint{color:var(--ink-soft);font-size:.82rem;text-align:center;padding:10px}

  footer{color:var(--ink-soft);font-size:.72rem;text-align:center;padding:18px 20px 26px;line-height:1.6}
  a{color:var(--accent)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.go:active{transform:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">🚌</div>
    <div>
      <h1>לאן?</h1>
      <p>תחבורה ציבורית בישראל · זמן אמת</p>
    </div>
  </header>

  <form id="f" autocomplete="off">
    <div class="field">
      <span class="pin">◉</span>
      <input id="from" placeholder="מאיפה יוצאים?" enterkeyhint="search">
      <button type="button" class="loc-btn" id="locBtn">📍 המיקום שלי</button>
    </div>
    <button type="button" class="swap" id="swap" title="החלף">⇅</button>
    <div class="field">
      <span class="pin">◎</span>
      <input id="to" placeholder="לאן מגיעים?" enterkeyhint="search">
    </div>
    <div class="row2">
      <div class="seg" role="group" aria-label="מתי">
        <button type="button" id="nowBtn" aria-pressed="true">עכשיו</button>
        <button type="button" id="atBtn" aria-pressed="false">בשעה</button>
      </div>
      <input type="time" id="time" hidden>
    </div>
    <button class="go" id="go" type="submit">חפש מסלול</button>
  </form>

  <main id="out">
    <p class="hint">הקלד מוצא ויעד — או לחץ 📍 למיקום הנוכחי — וקבל מסלול אוטובוסים עם זמני אמת וקורקינטים בקרבת מקום.</p>
  </main>

  <footer>
    בנוי על נתוני התחבורה הפתוחים של משרד התחבורה (GTFS · SIRI · GBFS).<br>
    שירות אישי — ייתכנו תקלות זמניות בזמן אמת. נסה שוב.
  </footer>
</div>

<script>
  const API = "https://89-167-124-21.sslip.io";
  const $ = (id) => document.getElementById(id);
  const out = $("out");
  let mode = "now"; // now | at

  // time segment
  $("nowBtn").onclick = () => setMode("now");
  $("atBtn").onclick = () => { setMode("at"); if(!$("time").value){ const d=new Date(); $("time").value=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; } };
  function setMode(m){ mode=m; $("nowBtn").setAttribute("aria-pressed",m==="now"); $("atBtn").setAttribute("aria-pressed",m==="at"); $("time").hidden = m!=="at"; }

  // swap
  $("swap").onclick = () => { const a=$("from").value; $("from").value=$("to").value; $("to").value=a; };

  // geolocation
  $("locBtn").onclick = () => {
    if(!navigator.geolocation){ alert("הדפדפן לא תומך במיקום"); return; }
    $("locBtn").textContent = "…מאתר";
    navigator.geolocation.getCurrentPosition(
      (p) => { $("from").value = `${p.coords.latitude.toFixed(5)},${p.coords.longitude.toFixed(5)}`; $("locBtn").textContent = "📍 המיקום שלי"; },
      () => { $("locBtn").textContent = "📍 המיקום שלי"; alert("לא הצלחתי לאתר מיקום"); },
      { enableHighAccuracy:true, timeout:8000 }
    );
  };

  $("f").addEventListener("submit", (e) => { e.preventDefault(); plan(); });

  async function plan(){
    const from = $("from").value.trim(), to = $("to").value.trim();
    if(!from || !to){ out.innerHTML = `<p class="status err">נא למלא מוצא ויעד</p>`; return; }
    const q = new URLSearchParams({ from, to, maxTransfers:"2", scooterRadiusM:"250" });
    if(mode==="at" && $("time").value) q.set("time", $("time").value);
    out.innerHTML = `<div class="status"><div class="spin"></div>מחפש את המסלול הטוב ביותר…</div>`;
    $("go").disabled = true;
    try{
      const r = await fetch(`${API}/api/trips/plan?${q}`);
      const p = await r.json();
      if(p.error){ out.innerHTML = `<p class="status err">${esc(p.error)}</p>`; return; }
      render(p);
    }catch(err){
      out.innerHTML = `<p class="status err">אין חיבור לשרת. נסה שוב.</p>`;
    }finally{ $("go").disabled = false; }
  }

  function render(p){
    const opts = [...(p.direct||[]), ...(p.withTransfers||[])];
    if(!opts.length){ out.innerHTML = `<p class="status">לא נמצא מסלול בזמן שנבחר. נסה שעה אחרת.</p>`; return; }
    const nm = (e)=> e?.stop?.name || (e?.resolvedVia==="landmark" ? e?.landmark?.name : "מיקום");
    let html = `<div class="route-head"><b>${esc(nm(p.from))}</b><span class="arw">←</span><b>${esc(nm(p.to))}</b></div>`;
    const scoot = (p.from?.nearbyScooters||[]).slice(0,3);
    for(const o of opts.slice(0,6)) html += optCard(o, scoot);
    scoot.length ? null : 0;
    out.innerHTML = html;
    // attach scooters only to the first option
    const first = out.querySelector(".opt");
    if(first && scoot.length) first.insertAdjacentHTML("beforeend", scooterStrip(scoot));
  }

  function optCard(o){
    const transfers = o.transfers===0 ? "ישיר" : `${o.transfers} החלפ${o.transfers>1?"ות":"ה"}`;
    let legs = "";
    for(const l of o.legs){
      if(l.mode==="WALK"){
        legs += leg("walk","↔",`הליכה${l.distanceMeters?` · ${l.distanceMeters} מ'`:""}`, l.to||"", `${l.durationMin} ד'`);
      }else{
        const cls = (l.mode==="RAIL"||l.mode==="SUBWAY"||l.mode==="TRAM")?"rail":"";
        const sub = [l.operator, l.headsign].filter(Boolean).join(" · ");
        legs += leg(cls, esc(l.line||"?"), `${esc(l.from||"")} ← ${esc(l.to||"")}`, `${l.depart||""}→${l.arrive||""}`, sub);
      }
    }
    return `<div class="opt">
      <div class="opt-top">
        <div class="opt-time">${o.depart||""}<span class="arw">←</span>${o.arrive||""}</div>
        <div class="opt-meta"><span class="dur">${o.durationMin} דק'</span> · ${transfers}${o.walkMin?` · ${o.walkMin} ד' הליכה`:""}</div>
      </div>
      <div class="legs">${legs}</div>
    </div>`;
  }
  function leg(cls, bullet, a, t, b){
    return `<div class="leg"><span class="bul ${cls}">${bullet}</span>
      <span class="txt"><div class="a">${a}</div>${b?`<div class="b">${esc(b)}</div>`:""}</span>
      <span class="t">${esc(t)}</span></div>`;
  }
  function scooterStrip(sc){
    const chips = sc.map(s=>{
      const charge = s.batteryPercent!=null ? `<b>${s.batteryPercent}%</b>` : (s.rangeKm!=null?`${s.rangeKm} ק"מ`:"");
      return `<span class="chip">🛴 ${esc(s.operator)} · ${s.distanceMeters}מ' ${charge}</span>`;
    }).join("");
    return `<div class="scoot"><span class="badge"><span class="ldot"></span>קורקינטים ליד המוצא</span>${chips}</div>`;
  }
  function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
